allowed_targets:
  - "https://purl.humanatlas.io/ref-organ/brain-male/v1.4#primary"
  - "http://purl.org/ccf/latest/ccf.owl#VHMAllenBrain"

donor:
  sex: Male
  provider_name: MC-IU
  provider_uuid: 87751d4c-a850-4e2c-84dc-da6a797d76de
