input_files:
  source: "julich-brain.glb"

target_name: "https://purl.humanatlas.io/ref-organ/brain-female/v1.4#primary"

visual_hull:
  target_grid: 120
  image_size: 420
  force_rebuild: false

allowed_targets:
  - "https://purl.humanatlas.io/ref-organ/brain-female/v1.4#primary"
  - "http://purl.org/ccf/latest/ccf.owl#VHFAllenBrain"

donor:
  sex: Female
  provider_name: MC-IU
  provider_uuid: 87751d4c-a850-4e2c-84dc-da6a797d76de
  consortium_name: HRA
  id: "https://purl.humanatlas.io/millitome/brain-female-julich/v1.0"
  selected-organ: "http://purl.obolibrary.org/obo/UBERON_0000955"

siibra:
  atlases: "human"
  template_space: "MNI_COLIN_27" 

rui_location:
  "@context": "https://hubmapconsortium.github.io/ccf-ontology/ccf-context.jsonld"
  "@type": "SpatialEntity"
  creator: "Antara Bhavsar"
  creator_first_name: "Antara"
  creator_last_name: "Bhavsar"
  creator_orcid: "https://orcid.org/0009-0006-6491-6503"
  dimension_units: "millimeter"
  placement:
    "@context": "https://hubmapconsortium.github.io/ccf-ontology/ccf-context.jsonld"
    "@type": "SpatialPlacement"
    target: "https://purl.humanatlas.io/ref-organ/brain-female/v1.4#primary"
    scaling_units: "ratio"
    rotation_order: "XYZ"
    rotation_units: "degree"
    translation_units: "millimeter"

nonrigid_registration:
  autotune: 'False'
  gamma: 0.1
  beta: 0.5
  decimation: 'False'
  distance_threshold: 1.0e-06
  lambda: 1000
  downsampling: 'X,40000,0.05,Y,40000,0.05'
  max_iterations: 100
  seed: 26

rigid_registration:
  global_distance_threshold_factor: 0.23
  global_edge_length_threshold_factor: 0.95
  global_max_correspondence: 0.999
  global_max_iterations: 100000
  max_nn: 100
  refine_distance_threshold_factor: 0.1
  voxel_size: 0.025

non_hra_mapping:
  rotation_deg: [-90, -180, 0]
